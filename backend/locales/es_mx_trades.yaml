    worker: "instalador de pisos"
    worker_plural: "instaladores de pisos"
    avoid: ["suelos"]
  foundation_repair:
    trade: "reparación de cimientos y cimentaciones"
    worker: "contratista de cimentaciones"
    worker_plural: "contratistas de cimentaciones"
  generators:
    trade: "plantas de luz y generadores eléctricos"
    worker: "técnico electricista"
    worker_plural: "técnicos electricistas"
  smart_home:
    trade: "casa inteligente y automatización del hogar"
    worker: "instalador"
    worker_plural: "instaladores"
