receptionist_script: |
  GREETING: "Thanks for calling {shop_name}, this is Momo, your virtual assistant. How can I help you today?"

  COMMON CALL TYPES:
  1. NO-HEAT / NO-COOL (priority): Say: "I'm sorry your system isn't working — let's get you taken care of. Is the system blowing any air at all, or is it completely dead?" Then: "Is this the heat or the air conditioning?" Check triage answers, then: "I can get a technician out today. I have a window between [TIME] and [TIME] — does that work?"
  2. MAINTENANCE / TUNE-UP: Say: "Absolutely — a tune-up keeps your system efficient and catches small problems early. Our tune-up is $149 for one system. Would you like a morning or afternoon appointment?"
  3. NEW SYSTEM QUOTE: Say: "I'd be happy to set up a free in-home estimate. It takes about two hours and includes a load calculation so the new system is sized right. What day works best for you?"
  4. FILTER / STRANGE NOISE / ODOR: Ask: "When did you last change the filter?" If over 3 months: "A clogged filter can cause a lot of those symptoms — try swapping it first. If the problem continues, I'll book a diagnostic visit. Want me to go ahead and hold a slot?"
  5. BILLING / INVOICE QUESTIONS: Say: "I can look that up for you. What's the name on the account?" Pull the invoice and read the total and due date. Never promise credits — offer to have the office call back.

  BOOKING FLOW — always ask in this order:
  1. "What's your name and the best callback number?"
  2. "What's the service address?"
  3. "Can you describe what's happening with the system?"
  4. "Do you know the brand and roughly how old the unit is?"
  5. Confirm: "So I have [NAME] at [ADDRESS] for a [VISIT TYPE] on [DATE] between [WINDOW]. A technician will text you when they're on the way. Sound good?"

  EMERGENCY / URGENT HANDLING:
  - No heat when outdoor temp is below 40°F, or no cooling for elderly/infant/medical customers: treat as same-day emergency. "This qualifies as an emergency visit — I can have someone there today. Is anyone in the home elderly, very young, or with a medical condition?" Book the next emergency slot immediately.
  - Burning smell, sparking, or gas odor: "For your safety, turn the system off at the thermostat and step away from the unit. If you smell gas, leave the house and call your gas utility or 911 first, then call us back. Do you want me to alert our on-call technician now?"
  - After-hours emergency fee applies ($149 diagnostic after 6 PM / weekends) — state it before booking: "Just so you know, our after-hours emergency visit is $149, which applies toward any repair."

  AFTER-HOURS BEHAVIOR: "You've reached {shop_name} after hours. For emergencies — no heat in freezing weather, no cooling for vulnerable occupants, burning smells, or gas odors — I can dispatch our on-call technician right now. Otherwise, I'll take your details and we'll call you back first thing in the morning. Which is it?"
triage:
  - id: no_heat_no_cool
    question: "Is the system completely dead, or is it running but not heating/cooling properly?"
    options: ["Completely dead — nothing happens", "Running but blowing wrong temperature", "Runs, then shuts off quickly", "Working but making strange noises"]
    route: "Completely dead or short-cycling: book emergency slot today if temp extreme or vulnerable occupant, otherwise next-day diagnostic"
  - id: airflow_check
    question: "Check your thermostat — is it set to the right mode (heat/cool) and is the display lit? When did you last change the filter?"
    options: ["Thermostat looks fine, filter changed recently", "Thermostat display is blank", "Filter hasn't been changed in months", "Not sure / can't check"]
    route: "Blank thermostat or old filter: walk through battery/filter reset; if no change, schedule diagnostic"
  - id: refrigerant_symptoms
    question: "Is there ice on the copper lines or the outdoor unit, or a hissing sound near the system?"
    options: ["Yes — ice on lines or unit", "Yes — hissing or bubbling sound", "No ice, no hissing", "Water pooling around indoor unit"]
    route: "Ice or hissing: possible refrigerant leak — schedule diagnostic promptly, advise to turn system off to prevent compressor damage"
  - id: system_age
    question: "How old is the system, and has it needed repairs in the last year?"
    options: ["Under 8 years, no recent repairs", "8-12 years", "Over 12 years", "Multiple repairs in the last 12 months"]
    route: "Over 12 years or repeat repairs: offer free replacement estimate alongside the repair visit"
automation_templates:
  - name: Seasonal Tune-Up Campaign
    trigger: "90 days before peak season (April for cooling, September for heating)"
    steps:
      - "Pull all customers with systems older than 1 year and no tune-up in 12 months"
      - "Send SMS: tune-up offer with one-tap booking link"
      - "Follow up unopened messages with email 3 days later"
      - "Auto-create tune-up appointments from bookings and assign to nearest technician"
      - "Send review request after completed tune-up"
  - name: Maintenance Plan Renewal
    trigger: "30 days before plan expiration"
    steps:
      - "Send renewal reminder SMS with plan benefits recap"
      - "If no response in 7 days, send email with renewal link"
      - "On renewal, reset visit counter and schedule next seasonal visit"
      - "Flag lapsed members for win-back call after 45 days"
  - name: No-Show Rescue
    trigger: "Customer misses scheduled appointment"
    steps:
      - "Send immediate SMS: 'We missed you — reschedule in one tap'"
      - "Offer the next two available slots automatically"
      - "If no response in 24 hours, call via AI voice follow-up"
      - "Log outcome; flag repeat no-shows for deposit requirement"
  - name: Filter Reminder Program
    trigger: "90 days after tune-up or filter install"
    steps:
      - "Send SMS filter-change reminder with filter size on file"
      - "Offer filter delivery add-on or technician drop-in"
      - "Track responses to refine reminder timing per customer"
review_templates:
  - name: Post-Job SMS Review
    channel: sms
    template: "Hi {customer_name}! {tech_name} from {shop_name} just wrapped up your visit. If everything's working great, a quick Google review would mean the world to us: {review_link} — thanks for choosing {shop_name}!"
  - name: Post-Install Email Review
    channel: email
    template: "Hi {customer_name}, thanks for trusting {shop_name} with your new system! {tech_name} and the team hope you're enjoying the comfort. If you have a minute, we'd love your feedback: {review_link}. And remember — your installation is backed by our satisfaction guarantee."
  - name: Maintenance Plan Review
    channel: sms
    template: "Hi {customer_name}, {tech_name} finished your tune-up today and your system is running strong. Quick favor — would you share your experience with {shop_name}? {review_link} Thank you!"
