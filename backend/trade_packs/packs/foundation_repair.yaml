receptionist_script: |
  Greeting: "Thanks for calling {shop_name}, this is the AI assistant. Are you calling about cracks, water, or something shifting in your foundation?"

  Common call types and what to do:
  - Crack in a basement or foundation wall: ask whether the crack is hairline, wider than a quarter inch, stair-stepping through mortar, horizontal, or leaking. Log crack_type and width_estimate, then book a Foundation Assessment within 5 business days. Mention the $299 inspection and that it is credited toward any repair work.
  - Water in the basement or crawl space: ask if water is coming in now, after heavy rain only, or as chronic dampness. Active water intrusion = priority: offer the next available appointment within 48 hours and explain the drain tile/sump options briefly.
  - Doors or windows sticking, sloping floors: flag as settlement signals. Ask how long it has been noticed and whether it is getting worse, then book a Foundation Assessment.
  - Bowing or leaning wall: treat as higher priority. Ask if the bow is visible to the eye and whether there is water outside against that wall. Offer an assessment within 72 hours; do not downplay.
  - Quote comparison: offer the free quote review — ask who else quoted and offer to schedule our assessment so the customer can compare line by line.

  Booking flow:
  1. Capture name, address, phone, and email.
  2. Confirm foundation type (poured concrete, block, slab, crawl space) and home age if known.
  3. Book the assessment slot and text the confirmation with a photo-upload link so the specialist sees the cracks beforehand.
  4. Note gate codes, pets, and basement access details.

  Urgent handling: sudden large cracks after a storm, a wall that visibly moved, or flooding in the basement = urgent. Offer the soonest slot, give the customer emergency mitigation steps (move valuables, check the sump, shut off water if a pipe is involved), and flag the shop owner immediately.

  After-hours: "Thanks for calling {shop_name}. If water is entering your home right now, press 1 to be connected to our on-call specialist. Otherwise, leave your name, address, and what you're seeing — we'll call you back first thing in the morning and hold an assessment slot for you."
triage:
  - id: crack_profile
    question: What kind of crack are you seeing in the foundation?
    options: [Hairline vertical crack, Crack wider than a quarter inch, Stair-step crack through mortar joints, Horizontal crack along the wall, Leaking or seeping crack]
    route: Log crack_profile on the intake record; route leaking or horizontal cracks to a priority assessment slot within 72 hours.
  - id: settlement_signs
    question: Are you noticing any of these inside the home?
    options: [Doors or windows sticking, Sloping or uneven floors, Cracks above door frames, Gaps around windows or trim, None of these]
    route: Log selected signs; any settlement sign upgrades the call to a specialist callback the same day.
  - id: water_intrusion
    question: Is water getting into the basement or crawl space?
    options: ["Yes — actively right now", "Only after heavy rain", "Chronic dampness or musty smell", "No water issues"]
    route: Active water gets a 48-hour priority slot plus emergency mitigation steps; rain-only and dampness go to a standard assessment with a sump/drainage consult.
  - id: repair_timeline
    question: How soon are you hoping to get this handled?
    options: [As soon as possible, Within the next month, Just gathering quotes, Not sure yet]
    route: ASAP books the next open slot immediately; gathering quotes triggers the quote-comparison follow-up automation.
automation_templates:
  - name: Assessment to Quote Follow-up
    trigger: foundation_assessment_completed
    steps:
      - Generate the written findings report and quote within 24 hours of the visit.
      - Text the customer a link to the report with a 3-line summary of the top issue.
      - Follow up by SMS on day 3 if the quote has not been viewed.
      - Follow up by phone or email on day 7 with a comparison offer to review competing quotes line by line.
      - After 21 days of no response, mark the opportunity dormant and send a seasonal check-in later.
  - name: Pier Install Day Prep
    trigger: pier_job_confirmed
    steps:
      - Confirm the date by SMS and ask about exterior access, landscaping near the dig zone, and underground utilities.
      - Auto-run a utility-locate ticket 72 hours before the dig.
      - Text the crew arrival window the evening before.
      - Day of: send the specialist's name and photo to the customer.
      - After completion: send the elevation survey results and warranty certificate.
  - name: Waterproofing Season Nudge
    trigger: heavy_rain_season_start
    steps:
      - Pull customers with past water-intrusion assessments who never booked.
      - Send an SMS offering a discounted reassessment before storm season.
      - Book directly from the reply with no phone tag.
  - name: Warranty Anniversary Check
    trigger: job_completed_anniversary_1yr
    steps:
      - Send a reminder that the annual crack re-measure is free under warranty.
      - Offer two scheduling options by SMS.
      - After the check, update the warranty record and ask for a review.
review_templates:
  - name: Post-Repair Review Request
    channel: sms
    template: "Hi {customer_name}, this is {shop_name}. Your foundation work is wrapped up and the final measurements look solid. If {tech_name} and the crew did right by you, would you leave us a quick review? {review_link} — it helps neighbors trust the work. Thanks!"
  - name: Assessment Experience Review
    channel: email
    template: "Subject: How was your foundation assessment, {customer_name}?\n\nHi {customer_name},\n\n{tech_name} from {shop_name} stopped by to assess your foundation. Whether you move forward with us or not, a short review of your experience helps other homeowners find honest answers. Leave one here: {review_link}\n\nThanks,\n{shop_name}"
  - name: Warranty Check Review
    channel: sms
    template: "{customer_name}, it's been a year since {shop_name} stabilized your foundation — and today's re-check confirms everything is holding. If you'd vouch for {tech_name}'s work, we'd be grateful: {review_link}"
