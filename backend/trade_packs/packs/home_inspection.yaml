receptionist_script: |
  Greeting: "Thanks for calling {shop_name}, this is the AI assistant. Are you buying, selling, or building — and when do you need the inspection?"

  Common call types and what to do:
  - Buyer under contract: ask the contingency or option-period deadline FIRST — everything schedules around it. Ask square footage, age, and foundation type, then book the inspection at least 48 hours before the deadline. Offer the rush report if the deadline is tight.
  - Add-ons (radon, termite, sewer scope, mold): explain each in one line and recommend the bundle — most buyers add at least radon and termite. Confirm the home has a basement or crawl space (radon) and is on septic or sewer (sewer scope relevance).
  - Pre-listing seller or realtor: ask the target list date and whether they want repairs prioritized by deal-killer severity. Book the pre-listing inspection and offer to coordinate directly with their realtor.
  - New construction phase: ask which phase (pre-drywall, pre-final, 11-month warranty) and the builder's name. Book the phase inspection and note builder access requirements.
  - Price shoppers: give the size-based pricing ($425 / $525 / $650) and explain the same-day digital report with photos is included. Book from the quote.
  - Realtor partners: capture the agent's name, brokerage, and preferred report delivery (email + portal). Flag them for the agent-partner follow-up.

  Booking flow:
  1. Capture the buyer's name, phone, email — plus the realtor's name and contact.
  2. Confirm property address, sqft, age, deadline, and chosen add-ons.
  3. Book the slot and text confirmation with the inspection-day checklist (utilities on, attic/crawl access clear, pets secured).
  4. Confirm who attends and send the realtor a courtesy confirmation.

  Urgent handling: a contingency deadline within 48 hours = urgent. Offer the soonest slot plus the Rush 24-Hour Report add-on, and flag the shop owner. Never promise to "go easy" on the inspection — explain the inspector works for the buyer's information, not the deal.

  After-hours: "Thanks for calling {shop_name}. If you're under contract, tell us your option or contingency deadline right in your message — we schedule around it. Leave your name, the property address, and the deadline, and we'll call you back first thing in the morning with the earliest slot that beats it."
triage:
  - id: contingency_deadline
    question: Are you under contract — when is your inspection or option deadline?
    options: [Within 48 hours, Within a week, 1–2 weeks out, Just shopping / pre-listing, New construction phase]
    route: Log the exact deadline date; within 48 hours routes to urgent scheduling plus the Rush 24-Hour Report offer.
  - id: home_profile
    question: Tell me about the property.
    options: ["Under 2,000 sqft", "2,000–3,500 sqft", "Over 3,500 sqft", "Condo or townhome", "50+ years old — any size"]
    route: Log sqft band for pricing; 50+ years old flags the sewer-scope and electrical-panel talking points.
  - id: addon_needs
    question: Which additional tests do you want with the inspection?
    options: [Radon test, Termite / WDI inspection, Sewer scope, Mold air sampling, Just the general inspection]
    route: Log selected add-ons on the booking; radon bookings auto-schedule the 48-hour drop-off/pickup pair.
  - id: client_role
    question: Who is the inspection for?
    options: [Buyer — I'm under contract, Buyer — still shopping, Seller — pre-listing, Realtor booking for a client, Builder phase inspection]
    route: Realtor bookings capture agent details for the partner follow-up automation; seller bookings trigger the pre-listing report flow.
automation_templates:
  - name: Report Delivery & Buyer Follow-up
    trigger: inspection_completed
    steps:
      - Deliver the digital report with photos within the promised window (same day, or 24 hours with rush).
      - Text the buyer a 5-line plain-English summary of the top findings with severity tags.
      - Email the full report to the buyer's realtor automatically.
      - Day 2: check in — "Any questions on the report? Reply and the inspector will call you."
      - Day 5: if radon was tested, send the certified results with the EPA action-level explanation.
  - name: Realtor Partner Nurture
    trigger: realtor_first_booking
    steps:
      - Tag the agent as a partner and send a thank-you text after the first on-time report.
      - Share the agent one-pager: scheduling link, report turnaround, add-on menu.
      - After 3 on-time deliveries, send the preferred-partner co-marketing offer.
      - Quarterly: send the agent their booking stats and a seasonal inspection tip to share with clients.
  - name: Radon Pickup Reminder
    trigger: radon_monitor_placed
    steps:
      - Confirm closed-house conditions were explained via text at placement.
      - Reminder text at 24 hours: keep windows closed and the monitor untouched.
      - Auto-schedule the pickup visit at the 48-hour mark.
      - After pickup: text the preliminary reading; certified report follows within 24 hours.
  - name: Annual Maintenance Reminder
    trigger: inspection_anniversary_11mo
    steps:
      - Text past buyers: it's been almost a year — time for the annual maintenance inspection.
      - Offer the $375 checkup with one-tap booking.
      - Include the seasonal tip (gutters, furnace filter, water heater) to make the message useful even if they decline.
review_templates:
  - name: Post-Report Review Request
    channel: sms
    template: "Hi {customer_name}, your inspection report is delivered — check your email for the full photo version. If {tech_name} was thorough and explained everything clearly, would you leave us a review? {review_link} Good luck with the home! — {shop_name}"
  - name: Realtor Review Request
    channel: email
    template: "Subject: Report delivered on time, {customer_name}\n\nHi {customer_name},\n\nYour report beat the deadline and your realtor has the full copy. Buying a home is stressful enough — if {shop_name} made the inspection part easy, a review here helps the next buyer: {review_link}\n\n— {tech_name}, {shop_name}"
  - name: Pre-Listing Review
    channel: sms
    template: "{customer_name}, your pre-listing report is in your inbox with the repairs ranked by deal-killer priority. If {tech_name} helped you list with confidence, a review means a lot: {review_link} — {shop_name}"
