receptionist_script: |
  Greeting: "Thanks for calling {shop_name}, this is the AI assistant. Are you looking at a new whole-home generator, or do you have one that needs service?"

  Common call types and what to do:
  - New generator quote: ask home square footage, fuel source (natural gas or propane), and which circuits must stay on (well pump, medical equipment, AC). Book a Site Assessment within 7 days. Mention the $199 assessment is credited toward any install.
  - Outage happened and they want protection before the next storm: capture urgency — ask when the last outage was and how long it lasted. Offer the earliest assessment and explain typical 2-4 week permit-to-install timeline so expectations are set.
  - Generator not starting or showing a fault: ask the model and the fault code or light pattern if visible. If the outage is active now, treat as priority — offer same-day or next-day diagnostics. Remind them never to open panels or run portable generators indoors.
  - Maintenance due: check the service plan — if on the annual plan, book the maintenance visit; if not, offer the Storm-Season Tune-Up.
  - Price shoppers: give the ballpark ranges (14kW turnkey around $9,500; 22kW around $13,500) and explain sizing depends on the load calc — book the assessment to nail it.

  Booking flow:
  1. Capture name, address, phone, and email.
  2. Confirm fuel type, panel amperage, and whether there is an HOA with placement rules.
  3. Book the slot and text confirmation with a pre-visit checklist (clear the panel area, locate the gas meter).
  4. Note gate codes, dogs, and who will be home.

  Urgent handling: active outage with a failed generator, or a storm forecast within 48 hours with a customer who has medical equipment = urgent. Offer the soonest diagnostic slot, flag the shop owner, and give interim safety guidance.

  After-hours: "Thanks for calling {shop_name}. If your power is out right now and your generator isn't running, press 1 for our on-call installer. Otherwise leave your name, address, and whether this is a new install or service — we'll call you back first thing in the morning and hold an assessment slot for you."
triage:
  - id: outage_profile
    question: How often do you lose power, and how long do outages usually last?
    options: ["A few times a year — a few hours each", "A few times a year — lasting a day or more", "Rarely — but one bad outage convinced me", "Every storm season — sometimes for days"]
    route: Log outage_profile; multi-day outage history routes to whole-home sizing (22kW+) in the assessment notes.
  - id: home_load
    question: Roughly how big is the home, and what absolutely must stay on?
    options: ["Under 2,000 sqft — essentials only", "2,000–3,500 sqft — most of the house", "Over 3,500 sqft — whole home plus", "Medical equipment must stay on"]
    route: Log sqft band and must-run list for the load calculation; flag medical equipment as a priority scheduling note.
  - id: fuel_source
    question: What fuel would the generator run on?
    options: [Natural gas — already at the house, Propane — tank on site, Propane — would need a tank installed, Not sure]
    route: Log fuel_source; natural gas gets standard quote path, propane flags tank coordination with the install crew.
  - id: switch_status
    question: Do you already have an automatic transfer switch installed?
    options: ["Yes", "No", "Not sure"]
    route: Log transfer_switch; 'No' adds the transfer switch line item to the quote estimate range given on the call.
automation_templates:
  - name: Outage-Season Campaign
    trigger: storm_season_60_days_out
    steps:
      - Pull past assessment quotes that never booked plus customers due for tune-ups.
      - Send an SMS: "Storm season is 60 days out — {shop_name} has install slots left before it hits."
      - Offer one-tap booking from the message.
      - Follow up by email at day 14 with a storm-preparedness checklist and the tune-up offer.
      - Booked tune-ups get a pre-visit reminder with the readiness checklist.
  - name: Install Day Coordination
    trigger: generator_install_confirmed
    steps:
      - Confirm the date and text the pre-install checklist (pad area clear, gas meter accessible, HOA approval uploaded).
      - Auto-check permit status 5 days before; alert the office if it is still pending.
      - Evening-before text with the crew arrival window and lead installer's name.
      - Day of: send startup-test results and the first exercise-cycle confirmation.
      - Send the warranty registration link and remote-monitoring activation steps.
  - name: Post-Outage Check-In
    trigger: major_regional_outage
    steps:
      - Pull all installed-generator customers in the affected zip codes.
      - Send an SMS: "Did your system run? Reply RUN or FAULT."
      - Any FAULT reply creates a priority diagnostic ticket automatically.
      - After 7 days, send maintenance-plan upsell to customers who ran long hours.
  - name: Maintenance Plan Renewal
    trigger: annual_plan_30_days_to_expiry
    steps:
      - SMS the renewal offer with the locked-in price.
      - One-tap renewal link; expired cards prompt a secure update link.
      - On renewal, auto-schedule the yearly visit.
      - Lapsed customers get the storm-season tune-up offer instead.
review_templates:
  - name: Post-Install Review Request
    channel: sms
    template: "Hi {customer_name}, this is {shop_name} — your generator is installed and tested. When the next storm rolls through, you'll barely notice. If {tech_name} and the crew earned it, would you leave a quick review? {review_link} Thanks for trusting us with your backup power!"
  - name: After-First-Outage Review
    channel: email
    template: "Subject: Your generator did its job, {customer_name}\n\nHi {customer_name},\n\nYour {shop_name} generator just carried your home through a real outage — that's what it's for. {tech_name} sized and installed it for exactly this moment. If the install and the automatic switchover worked the way you hoped, a review helps neighbors make the same call: {review_link}\n\nStay powered,\n{shop_name}"
  - name: Maintenance Visit Review
    channel: sms
    template: "{customer_name}, your annual service is done — oil, filters, battery, and exercise cycle all check out. Quick favor: if {tech_name} keeps your system storm-ready, leave us a review: {review_link} — {shop_name}"
