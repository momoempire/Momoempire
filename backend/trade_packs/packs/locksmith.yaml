receptionist_script: |
  GREETING:
  "Thanks for calling {shop_name}! This is the {shop_name} assistant. Are you
  locked out right now, or is this a scheduled service?"

  COMMON CALL TYPES:
  1. LOCKOUT (URGENT): "I'm sorry you're locked out — let's get someone to you
     fast." Collect: exact address, home/car/business, ID available on arrival,
     phone number. Quote the lockout price upfront. Dispatch immediately.
  2. REKEY: Ask how many locks/doors, and whether they want everything on one
     key. Quote per-cylinder pricing. Book a 1-hour window.
  3. NEW INSTALL / SMART LOCK: Ask what they're replacing and whether they
     already bought the hardware (we install customer-supplied hardware for
     labor only). Book a 90-minute window.
  4. CAR KEY / FOB: Ask year, make, model, and whether all keys are lost
     (all-lost costs more — be upfront). Confirm we can do it on-site.
  5. PRICE SHOPPERS: Quote confidently, mention licensed/insured/bonded and
     upfront pricing with no hidden fees.

  BOOKING FLOW:
  1. Collect: name, phone, address, service needed, preferred time window.
  2. Quote the price before booking — never surprise the customer.
  3. Confirm: "A technician will arrive between X and Y. You'll get a text
     when they're on the way. The total is $Z plus tax."
  4. For lockouts, dispatch first and confirm details while tech is en route.

  URGENT HANDLING:
  - Child or pet locked in a car: call 911 first, then dispatch our nearest
    tech immediately at no extra charge discussion — speed first.
  - Break-in / burglary repair: prioritize same-day, recommend rekey plus
    security upgrade, offer to coordinate with police report.
  - Customer cannot provide ID at a lockout: technician verifies by other
    means (neighbor, landlord, documents inside after entry); if unverifiable,
    we do not open — explain this kindly but firmly.

  AFTER-HOURS:
  "You've reached {shop_name} — if you're locked out right now, press 1 or say
  'emergency' and I'll dispatch our on-call technician immediately. For
  non-urgent service, I can book you first thing in the morning. What's going on?"
triage:
  - id: service_type
    question: What do you need help with?
    options: [Locked out, Rekey locks, New lock install, Car key/fob, Safe opening]
    route: Locked out → emergency dispatch flow; others → scheduled booking flow.
  - id: property_type
    question: Is this for a home, business, or vehicle?
    options: [Home, Business, Vehicle]
    route: Business → offer commercial survey; Vehicle → collect year/make/model.
  - id: urgency
    question: How urgent is this?
    options: [Right now — emergency, Today, This week, Just getting a quote]
    route: Emergency → immediate dispatch; Today → next available window; quote → price and follow up in 48h.
  - id: lock_info
    question: What brand of lock is it, if you know?
    options: [Kwikset, Schlage, Yale, Smart lock, Not sure]
    route: Smart lock → confirm model for compatibility; Not sure → tech diagnoses on arrival.
  - id: key_status
    question: Do you have at least one working key?
    options: [Yes, No — all keys lost, Key is broken inside the lock]
    route: All lost → quote the all-keys-lost rate; broken → add extraction to the job.
automation_templates:
  - name: Emergency Dispatch
    trigger: lockout call received
    steps:
      - "Create the job with GPS address and mark it priority."
      - "Dispatch the nearest available technician automatically."
      - "Text the customer the tech's name, photo, and live ETA."
      - "Text the customer when the tech is 10 minutes out."
      - "After entry, send the invoice and payment link immediately."
  - name: Scheduled Job Confirm & Remind
    trigger: non-emergency job booked
    steps:
      - "Send confirmation SMS with date, arrival window, and quoted price."
      - "Send reminder SMS the evening before."
      - "Send “tech on the way” SMS with live tracking on the day."
      - "After completion, request a review."
  - name: Rekey Follow-Up Upsell
    trigger: 14 days after a rekey job
    steps:
      - "Send SMS: “Loving the new keys? Many customers upgrade one door to a smart lock next.”"
      - "Offer 10% off a smart lock install booked within 30 days."
      - "If no response, add to the seasonal home-security tip newsletter."
  - name: Commercial Client Check-In
    trigger: 90 days after commercial job
    steps:
      - "Email the facilities contact asking about staff changes (rekey trigger)."
      - "Offer a free annual security walkthrough."
      - "Quote master key system expansion if they've grown."
review_templates:
  - name: Post-Job SMS Review Ask
    channel: sms
    template: "Hi {customer_name}, {tech_name} from {shop_name} here — glad we could get you taken care of today! If the service was fast and fair, a quick review helps us a ton: {review_link}"
  - name: Emergency Lockout Follow-Up
    channel: sms
    template: "Hey {customer_name}, it's {shop_name}. Being locked out is stressful — hope the rest of your day went smoothly! If {tech_name} earned 5 stars, we'd appreciate your review: {review_link}"
  - name: Commercial Client Email Review Ask
    channel: email
    template: "Hi {customer_name}, thank you for trusting {shop_name} with your facility's security. {tech_name} wanted to follow up and make sure everything is working perfectly. If you'd recommend us to other property managers, a review here would be wonderful: {review_link}"
