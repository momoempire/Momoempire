  - name: New Door Email Review
    channel: email
    template: "Hi {customer_name}, your new garage door looks fantastic — thanks for choosing {shop_name}! {tech_name} and the crew hope you love it. If you're happy, please share your experience: {review_link}. Your warranty details are attached."
  - name: Emergency Fix SMS Review
    channel: sms
    template: "Hi {customer_name}, glad we could get you unstuck today! If {shop_name} saved the day, a quick review would mean a lot: {review_link} — {tech_name}"
