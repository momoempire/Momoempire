# Example site config for Momoempire FastAPI on Linode (EMP-DEV-003).
# Replace api.example.com / REPLACE_UPSTREAM. Not production-active in-repo.
# Tested with: nginx -t -c /etc/nginx/nginx.conf (see runbook verification).

upstream momoempire_api {
    server 127.0.0.1:8001;
    keepalive 32;
}

# HTTP → HTTPS (Certbot will usually manage this; shown for clarity)
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    # Certbot paths (placeholders)
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;  # knowledge_docs max 10MB + multipart overhead

    # Health (optional public)
    location = /api/health {
        proxy_pass http://momoempire_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://momoempire_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streaming / long responses (admin zip, LLM streams if any)
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # WebSocket upgrade (if/when WS routes are added; harmless for HTTP)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
