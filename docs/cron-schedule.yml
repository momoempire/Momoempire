# Cron schedule definitions (platform-neutral).
# These schedules drive the POST /api/cron/* endpoints in backend/routers/cron.py.
# Point any external scheduler (system cron, Render Cron Jobs, Cloudflare, etc.)
# at the endpoints below with the WEBHOOK_CRON_SECRET bearer; times are UTC.
crons:
  - name: followups-dispatch
    description: "Dispatch scheduled follow-up SMS/emails whose send_at is due"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/followups"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: appt-reminders
    description: "Send 24h-before SMS reminders for upcoming appointments"
    cron: "15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/appointment-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: overage-nightly
    description: "Compute and charge per-tenant overage every night at 02:30 UTC"
    cron: "30 2 * * *"
    endpoint: "{{BASE_URL}}/api/cron/overage-nightly"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: weekly-digest
    description: "Email every tenant owner a Monday morning summary of calls, leads, and tips"
    cron: "0 14 * * 1"
    endpoint: "{{BASE_URL}}/api/cron/weekly-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: callbacks-due
    description: "Dispatch scheduled AI call-backs when their time arrives"
    cron: "*/5 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/callbacks-due"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: appt-confirmations
    description: "Send 24h-before confirmation SMS asking YES / RESCHEDULE"
    cron: "25 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/appt-confirmations"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: daily-standup
    description: "7am local-ish SMS/email standup to owners: today's agenda + hot leads"
    cron: "0 13 * * *"
    endpoint: "{{BASE_URL}}/api/cron/daily-standup"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: repeat-reminders
    description: "Daily scan of repeat schedules; send reminders in window and advance due dates"
    cron: "30 13 * * *"
    endpoint: "{{BASE_URL}}/api/cron/repeat-reminders"
    method: POST
    enabled: true
  - name: overdue-reminders
    description: "Daily scan of unpaid invoices past due_at; emails reminder if not paused and under max_reminders"
    cron: "15 14 * * *"
    endpoint: "{{BASE_URL}}/api/cron/overdue-reminders"
    method: POST
    enabled: true
