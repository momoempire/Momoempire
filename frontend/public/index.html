<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <!-- No flash of the wrong theme: theme-init.js sets <html class="dark"> before first
             paint (same rule as src/components/ThemeProvider.jsx). External file so the
             Content-Security-Policy needs no 'unsafe-inline' for scripts. -->
        <script src="%PUBLIC_URL%/theme-init.js"></script>
        <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="%PUBLIC_URL%/favicon-32.png" type="image/png" sizes="32x32" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <!-- EMP-WL-014: description, Open Graph and Twitter tags are added at build time from
             REACT_APP_SITE_* (frontend/site-meta.js), which also replaces this title with
             REACT_APP_SITE_NAME. TODO(Brann): brand name. -->
        <title>Mind At Ease Solutions HVAC</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
