# ---- Portable deployment stack (Oracle Cloud Free / Fly machine / any VM) ----
# Front end goes on Cloudflare Pages; this compose only runs the backend + optional local MongoDB.
# For prod we recommend MongoDB Atlas Free (M0) instead of this local mongo service.

services:
  backend:
    build:
      context: ./backend
    image: ai-office-backend:latest
    restart: unless-stopped
    ports:
      # Loopback only: reach it through Nginx or a Cloudflare Tunnel on this host, never directly.
      - "127.0.0.1:8001:8001"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # OPTIONAL — delete this block and point MONGO_URL at Atlas instead.
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Not exposed publicly in prod; backend reaches it over the compose network.
    expose:
      - "27017"

volumes:
  mongo_data:

# Fixed subnet so the gateway (the address the backend sees for requests from a host-side
# Nginx/cloudflared via the published port) is predictable: set FORWARDED_ALLOW_IPS=172.30.0.1
# in backend/.env when running this compose file. See docs/deploy/client-ip-and-proxies.md.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
